<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Braket Community</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="ball.png" />

    <!-- Fonts: Syne (display), Inter (body), Space Mono (code/labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Space+Mono:wght@400;700&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <!-- SEO: Homepage meta tags for social sharing -->
    <meta
      name="description"
      content="Braket Community is a ticketing and vetting platform for community-run events."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Braket Community" />
    <meta
      property="og:description"
      content="Braket Community is a ticketing and vetting platform for community-run events."
    />
    <meta property="og:image" content="/logo_black.png" />
    <meta property="og:url" content="https://community.braket.gay/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Braket Community" />
    <meta
      name="twitter:description"
      content="Braket Community is a ticketing and vetting platform for community-run events."
    />
    <meta name="twitter:image" content="/logo_black.png" />

    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #fafafa;
        color: #171114;
        font-family:
          Inter, ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji',
          'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
      }

      html.dark,
      html.dark body {
        background: #0c090b;
        color: #f5f5f5;
        color-scheme: dark;
      }

      .app-boot-shell {
        --boot-background: #fafafa;
        --boot-foreground: #171114;
        --boot-muted: #6b5d64;
        --boot-line: rgba(70, 55, 63, 0.14);
        --boot-accent: #b91f5d;
        --boot-rail: rgba(70, 55, 63, 0.16);
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        position: relative;
        display: grid;
        place-items: end start;
        overflow: hidden;
        padding: clamp(1.25rem, 5vw, 3rem);
        isolation: isolate;
        background:
          linear-gradient(var(--boot-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--boot-line) 1px, transparent 1px),
          var(--boot-background);
        background-size:
          3.5rem 3.5rem,
          3.5rem 3.5rem,
          auto;
        color: var(--boot-foreground);
      }

      html.dark .app-boot-shell {
        --boot-background: #0c090b;
        --boot-foreground: #f5f5f5;
        --boot-muted: #b2a6ac;
        --boot-line: rgba(245, 245, 245, 0.08);
        --boot-accent: #d64178;
        --boot-rail: rgba(245, 245, 245, 0.14);
      }

      .app-boot-shell::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          135deg,
          transparent 0 58%,
          var(--boot-line) 58% calc(58% + 1px),
          transparent calc(58% + 1px)
        );
      }

      .app-boot-shell--overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
      }

      .app-boot-frame {
        width: min(100%, 27rem);
        display: grid;
        gap: 1rem;
        transform: translateZ(0);
      }

      .app-boot-kicker,
      .app-boot-status {
        font-family:
          'Space Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .app-boot-kicker {
        color: var(--boot-muted);
      }

      .app-boot-wordmark {
        font-family: Syne, ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(3.25rem, 16vw, 4.75rem);
        font-weight: 700;
        line-height: 0.88;
        letter-spacing: 0;
      }

      .app-boot-status {
        display: inline-flex;
        align-items: center;
        gap: 0.625rem;
        font-weight: 700;
        color: var(--boot-muted);
      }

      .app-boot-status-dot {
        width: 0.625rem;
        height: 0.625rem;
        border-radius: 999px;
        background: var(--boot-accent);
        animation: appBootPulse 1.1s ease-in-out infinite;
      }

      .app-boot-rail {
        width: min(100%, 18rem);
        height: 0.25rem;
        overflow: hidden;
        border-radius: 999px;
        background: var(--boot-rail);
      }

      .app-boot-rail > span {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: var(--boot-accent);
        transform-origin: left;
        animation: appBootRail 1.25s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      @keyframes appBootPulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.9);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes appBootRail {
        0% {
          transform: translate3d(-65%, 0, 0) scaleX(0.35);
        }

        55% {
          transform: translate3d(10%, 0, 0) scaleX(0.65);
        }

        100% {
          transform: translate3d(115%, 0, 0) scaleX(0.2);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-rail > span,
        .app-boot-status-dot {
          animation: none;
        }
      }
    </style>
    <script src="theme-init.js"></script>
  </head>
  <body>
    <app-root>
      <div class="app-boot-shell" role="status" aria-live="polite">
        <div class="app-boot-frame">
          <div class="app-boot-kicker">Community access</div>
          <div class="app-boot-wordmark">Braket</div>
          <div class="app-boot-status">
            <span class="app-boot-status-dot" aria-hidden="true"></span>
            <span>Opening Braket</span>
          </div>
          <div class="app-boot-rail" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </app-root>
  </body>
</html>
