<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Braket Community</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="ball.png" />

    <!-- Fonts: Syne (display), Inter (body), Space Mono (code/labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Space+Mono:wght@400;700&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <!-- SEO: Homepage meta tags for social sharing -->
    <meta
      name="description"
      content="Braket Community is a ticketing and vetting platform for community-run events."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Braket Community" />
    <meta
      property="og:description"
      content="Braket Community is a ticketing and vetting platform for community-run events."
    />
    <meta property="og:image" content="/logo_black.png" />
    <meta property="og:url" content="https://community.braket.gay/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Braket Community" />
    <meta
      name="twitter:description"
      content="Braket Community is a ticketing and vetting platform for community-run events."
    />
    <meta name="twitter:image" content="/logo_black.png" />

    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #fafafa;
        color: #171114;
        font-family:
          Inter, ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji',
          'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
      }

      html.dark,
      html.dark body {
        background: #0c090b;
        color: #f5f5f5;
        color-scheme: dark;
      }

      .app-boot-shell {
        --boot-background: #fafafa;
        --boot-foreground: #171114;
        --boot-muted: #6b5d64;
        --boot-accent: #b91f5d;
        --boot-loader-border: rgba(70, 55, 63, 0.18);
        --boot-loader-shadow: rgba(23, 17, 20, 0.12);
        --boot-loader-surface: rgba(250, 250, 250, 0.68);
        --boot-spinner-track: rgba(23, 17, 20, 0.34);
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        position: relative;
        display: grid;
        place-items: end start;
        overflow: hidden;
        padding: clamp(1.25rem, 5vw, 3rem);
        isolation: isolate;
        background: var(--boot-background);
        color: var(--boot-foreground);
      }

      html.dark .app-boot-shell {
        --boot-background: #0c090b;
        --boot-foreground: #f5f5f5;
        --boot-muted: #b2a6ac;
        --boot-accent: #d64178;
        --boot-loader-border: rgba(245, 245, 245, 0.14);
        --boot-loader-shadow: rgba(0, 0, 0, 0.26);
        --boot-loader-surface: rgba(12, 9, 11, 0.66);
        --boot-spinner-track: rgba(245, 245, 245, 0.34);
      }

      .app-boot-shell::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0.45;
        background-image: url('/waterfallTexture.webp');
        background-position: center;
        background-repeat: no-repeat;
        background-size: auto 160vh;
        transform: translateZ(0);
      }

      html.dark .app-boot-shell::before {
        opacity: 0.3;
        filter: invert(1);
      }

      .app-boot-shell--overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
      }

      .app-boot-frame {
        position: relative;
        z-index: 1;
        width: min(100%, 22rem);
        display: grid;
        transform: translateZ(0);
      }

      .app-boot-loader {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        pointer-events: none;
      }

      .app-boot-loader-inner {
        display: grid;
        justify-items: center;
        gap: 0.875rem;
        min-width: 8.5rem;
        padding: 1.25rem 1.35rem 1.15rem;
        border: 1px solid var(--boot-loader-border);
        border-radius: 999px;
        background: var(--boot-loader-surface);
        box-shadow: 0 1.5rem 4rem var(--boot-loader-shadow);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        transform: translateY(-0.5rem);
      }

      .app-boot-spinner {
        width: clamp(4rem, 12vw, 5.25rem);
        aspect-ratio: 1;
        border: 3px solid var(--boot-spinner-track);
        border-top-color: var(--boot-accent);
        border-right-color: var(--boot-accent);
        border-radius: 999px;
        animation: appBootSpin 0.9s linear infinite;
      }

      .app-boot-status {
        font-family:
          'Space Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .app-boot-wordmark {
        font-family: Syne, ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(3rem, 14vw, 4.25rem);
        font-weight: 700;
        line-height: 0.88;
        letter-spacing: 0;
      }

      .app-boot-status {
        color: var(--boot-foreground);
        font-weight: 700;
      }

      @keyframes appBootSpin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner {
          animation: none;
        }
      }
    </style>
    <!-- Theme init: inlined (CSP allows 'unsafe-inline') so first paint of
         the boot shell never waits on an extra uncached script request.
         Must run before paint to avoid a light-mode flash for dark users. -->
    <script>
      (function () {
        const html = document.documentElement;

        try {
          const theme = localStorage.theme;
          const prefersDark =
            window.matchMedia?.('(prefers-color-scheme: dark)').matches ??
            false;

          const isSystem = theme === 'system' || !('theme' in localStorage);
          const isDark = theme === 'dark' || (isSystem && prefersDark);
          const resolvedTheme = isDark ? 'dark' : 'light';
          html.classList.toggle('dark', isDark);
          html.classList.toggle('dark-theme', isDark);
          html.setAttribute('data-theme', theme ?? 'system');
          html.style.colorScheme = resolvedTheme;
        } catch {
          // localStorage may be blocked (private browsing) — fail silently
        }
      })();
    </script>
  </head>
  <body>
    <app-root>
      <div
        class="app-boot-shell"
        role="status"
        aria-live="polite"
        aria-label="Loading Braket Tickets"
      >
        <div class="app-boot-loader">
          <div class="app-boot-loader-inner">
            <div class="app-boot-spinner" aria-hidden="true"></div>
            <div class="app-boot-status">loading</div>
          </div>
        </div>
        <div class="app-boot-frame">
          <div class="app-boot-wordmark">Braket Tickets</div>
        </div>
      </div>
    </app-root>
  </body>
</html>
