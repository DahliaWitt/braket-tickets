name: 'Setup pnpm + Node'
description: >-
  Install pnpm (version from the root package.json "packageManager" field) and
  the .nvmrc Node version, restoring the pnpm store cache. For the ephemeral
  GitHub-hosted CI jobs; the self-hosted e2e job keeps its own uncached inline
  setup because its persistent warm disk beats a cache download.
runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
