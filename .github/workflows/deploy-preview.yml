name: Deploy Preview (develop)

# Deploys develop branch to Cloudflare Pages preview environment.
# Dev site: https://dev.community.braket.gay

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: Optional Git SHA override for manual preview deploys.
        required: false
        default: ''
        type: string
      branch:
        description: Optional branch label override for manual preview deploys.
        required: false
        default: ''
        type: string
      force_all:
        description: Force all preview deploy slices to run.
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-development
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-context:
    name: Resolve Development Deploy Context
    runs-on: self-hosted
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'develop'
        )
      }}
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      branch: ${{ steps.resolve.outputs.branch }}
      force_all: ${{ steps.resolve.outputs.force_all }}
    steps:
      - name: Checkout repository for ref validation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Resolve deploy ref
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.ref_name }}
          DEFAULT_SHA: ${{ github.sha }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_FORCE_ALL: ${{ inputs.force_all }}
          INPUT_REF: ${{ inputs.ref }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          ref="${INPUT_REF:-${WORKFLOW_RUN_SHA:-${DEFAULT_SHA}}}"
          branch="${INPUT_BRANCH:-${WORKFLOW_RUN_BRANCH:-${DEFAULT_BRANCH}}}"
          force_all="${INPUT_FORCE_ALL:-true}"

          if [ "${WORKFLOW_EVENT}" = "workflow_run" ]; then
            force_all=true
          fi

          if [ "${branch}" != "develop" ]; then
            echo "Development deploys must come from develop; got ${branch}."
            exit 1
          fi

          git fetch --no-tags origin +develop:refs/remotes/origin/develop

          if ! git cat-file -e "${ref}^{commit}" 2>/dev/null; then
            echo "::error::Development deploy ref ${ref} is not a commit available in this repository."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${ref}" origin/develop; then
            echo "::error::Development deploy ref ${ref} is not contained in origin/develop."
            exit 1
          fi

          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "force_all=${force_all}" >> "${GITHUB_OUTPUT}"

  changes:
    runs-on: self-hosted
    needs: deploy-context
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      observability: ${{ steps.detect.outputs.observability }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.deploy-context.outputs.ref }}
          fetch-depth: 0
      - name: Detect changed deployment slices
        id: detect
        env:
          DEPLOY_REF: ${{ needs.deploy-context.outputs.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          FORCE_ALL: ${{ needs.deploy-context.outputs.force_all }}
        run: |
          set -euo pipefail

          backend=false
          frontend=false
          observability=false

          if [ "${FORCE_ALL}" = 'true' ]; then
            backend=true
            frontend=true
            observability=true
          else
            changed_file_list="$(mktemp)"
            if [ -n "${EVENT_BEFORE}" ] && [ "${EVENT_BEFORE}" != '0000000000000000000000000000000000000000' ]; then
              git diff --name-only "${EVENT_BEFORE}" "${DEPLOY_REF}" > "${changed_file_list}"
            else
              git show --name-only --format='' "${DEPLOY_REF}" > "${changed_file_list}"
            fi

            while IFS= read -r path; do
              [ -n "${path}" ] || continue
              case "${path}" in
                .github/workflows/ci.yml|.github/workflows/deploy-preview.yml)
                  backend=true
                  frontend=true
                  observability=true
                  continue
                  ;;
              esac
              case "${path}" in
                backend/convex/*|backend/package.json|backend/scripts/*|convex.json|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|shared/*)
                  backend=true
                  ;;
              esac
              case "${path}" in
                frontend/*|package.json|pnpm-lock.yaml|shared/*)
                  frontend=true
                  ;;
              esac
              case "${path}" in
                ops/*|shared/log-sanitizer.mjs)
                  observability=true
                  ;;
              esac
            done < "${changed_file_list}"
          fi

          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "observability=${observability}" >> "${GITHUB_OUTPUT}"

  deploy-convex-dev:
    name: Deploy Backend to Convex (Dev)
    runs-on: self-hosted
    environment:
      name: development
      deployment: false
    needs: [deploy-context, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    env:
      ALLOW_LOCALHOST_CORS: ${{ secrets.ALLOW_LOCALHOST_CORS }}
      AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
      IS_TEST: ${{ secrets.IS_TEST }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_REPLY_TO: ${{ secrets.SMTP_REPLY_TO }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_WEBHOOK_SECRET_CONNECT: ${{ secrets.STRIPE_WEBHOOK_SECRET_CONNECT }}
      STRIPE_WEBHOOK_SECRET_V2_EVENTS: ${{ secrets.STRIPE_WEBHOOK_SECRET_V2_EVENTS }}
      TOKEN_DIGEST_SECRET: ${{ secrets.TOKEN_DIGEST_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.deploy-context.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Validate localhost CORS flag for preview
        run: |
          if [ -z "${ALLOW_LOCALHOST_CORS}" ]; then
            exit 0
          fi
          normalized="$(printf '%s' "${ALLOW_LOCALHOST_CORS}" | tr '[:upper:]' '[:lower:]')"
          if [ "${normalized}" = "1" ] || [ "${normalized}" = "true" ] || [ "${normalized}" = "yes" ] || [ "${normalized}" = "on" ]; then
            echo "SAFETY ABORT: ALLOW_LOCALHOST_CORS must be false in preview/prod deployments."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Sync Convex environment (Dev)
        working-directory: ./backend
        run: pnpm sync:env:dev

      - name: Deploy to Convex (Dev)
        env:
          DEPLOY_REF_NAME: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: pnpm convex deploy --message "dev deploy ${DEPLOY_REF_NAME} @ ${DEPLOY_SHA} by ${DEPLOY_ACTOR}"

  deploy-frontend-preview:
    name: Deploy Frontend to Cloudflare (Preview)
    runs-on: self-hosted
    environment:
      name: development
      deployment: false
    needs: [deploy-context, changes, deploy-convex-dev]
    if: ${{ needs.changes.outputs.frontend == 'true' && (needs.deploy-convex-dev.result == 'success' || needs.deploy-convex-dev.result == 'skipped') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.deploy-context.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (preview)
        working-directory: ./frontend
        run: pnpm build:preview
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Pages (Preview)
        working-directory: ./frontend
        run: pnpm wrangler pages deploy dist/frontend/browser --project-name=braket-tickets-frontend --branch=develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-observability-dev:
    name: Deploy Observability Stack (Dev Forwarder)
    runs-on: self-hosted
    environment:
      name: development
      deployment: false
    needs: [deploy-context, changes]
    outputs:
      deployed: ${{ steps.status.outputs.needs_deploy }}
    concurrency:
      group: deploy-observability-development
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.deploy-context.outputs.ref }}

      - name: Check forwarder status
        id: status
        shell: bash
        run: |
          set -euo pipefail

          changed='${{ needs.changes.outputs.observability }}'
          needs_deploy='false'
          reason='none'

          if [ "${changed}" = "true" ]; then
            needs_deploy='true'
            reason='config_changed'
          fi

          # Use docker compose to check service status (respects project name)
          container_id="$(docker compose -f ops/docker-compose.yml --profile dev-observability ps -q convex-log-forwarder-dev 2>/dev/null || true)"
          if [ -z "${container_id}" ]; then
            needs_deploy='true'
            if [ "${reason}" = 'none' ]; then
              reason='missing'
            else
              reason="${reason},missing"
            fi
          else
            running="$(docker inspect -f '{{.State.Running}}' "${container_id}" || echo false)"
            if [ "${running}" != 'true' ]; then
              needs_deploy='true'
              if [ "${reason}" = 'none' ]; then
                reason='offline'
              else
                reason="${reason},offline"
              fi
            fi
          fi

          echo "needs_deploy=${needs_deploy}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

      - name: Deploy dev forwarder (changed)
        if: ${{ steps.status.outputs.needs_deploy == 'true' && needs.changes.outputs.observability == 'true' }}
        run: docker compose -f ops/docker-compose.yml --profile dev-observability up -d --build convex-log-forwarder-dev
        env:
          CONVEX_DEV_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEV_LOG_DEDUP_CACHE_SIZE: ${{ secrets.CONVEX_DEV_LOG_DEDUP_CACHE_SIZE }}
          CONVEX_DEV_LOG_FORWARD_ALL: ${{ secrets.CONVEX_DEV_LOG_FORWARD_ALL }}
          CONVEX_DEV_LOG_INCLUDE_SUCCESS: ${{ secrets.CONVEX_DEV_LOG_INCLUDE_SUCCESS }}
          CONVEX_DEV_LOG_RECONNECT_MS: ${{ secrets.CONVEX_DEV_LOG_RECONNECT_MS }}
          CONVEX_DEV_LOG_SINK: ${{ secrets.CONVEX_DEV_LOG_SINK == 'sentry' && secrets.SENTRY_DSN != '' && 'sentry' || 'none' }}
          CONVEX_DEV_LOG_TARGET: ${{ secrets.CONVEX_DEV_LOG_TARGET }}
          SENTRY_DSN_DEVELOPMENT: ${{ secrets.SENTRY_DSN }}

      - name: Restore dev forwarder (offline or missing)
        if: ${{ steps.status.outputs.needs_deploy == 'true' && needs.changes.outputs.observability != 'true' }}
        run: docker compose -f ops/docker-compose.yml --profile dev-observability up -d convex-log-forwarder-dev
        env:
          CONVEX_DEV_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEV_LOG_DEDUP_CACHE_SIZE: ${{ secrets.CONVEX_DEV_LOG_DEDUP_CACHE_SIZE }}
          CONVEX_DEV_LOG_FORWARD_ALL: ${{ secrets.CONVEX_DEV_LOG_FORWARD_ALL }}
          CONVEX_DEV_LOG_INCLUDE_SUCCESS: ${{ secrets.CONVEX_DEV_LOG_INCLUDE_SUCCESS }}
          CONVEX_DEV_LOG_RECONNECT_MS: ${{ secrets.CONVEX_DEV_LOG_RECONNECT_MS }}
          CONVEX_DEV_LOG_SINK: ${{ secrets.CONVEX_DEV_LOG_SINK == 'sentry' && secrets.SENTRY_DSN != '' && 'sentry' || 'none' }}
          CONVEX_DEV_LOG_TARGET: ${{ secrets.CONVEX_DEV_LOG_TARGET }}
          SENTRY_DSN_DEVELOPMENT: ${{ secrets.SENTRY_DSN }}

  record-deployment:
    name: Record Development Deployment
    runs-on: self-hosted
    needs:
      [
        changes,
        deploy-context,
        deploy-convex-dev,
        deploy-frontend-preview,
        deploy-observability-dev,
      ]
    if: >-
      ${{
        always() &&
        needs.deploy-context.result == 'success' &&
        (
          needs.changes.result != 'success' ||
          needs.changes.outputs.backend == 'true' ||
          needs.changes.outputs.frontend == 'true' ||
          needs.changes.outputs.observability == 'true' ||
          needs.deploy-observability-dev.outputs.deployed == 'true'
        )
      }}
    environment: development
    steps:
      - name: Record deployment
        run: |
          set -euo pipefail

          failed=false
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.deploy-convex-dev.result }}" \
            "${{ needs.deploy-frontend-preview.result }}" \
            "${{ needs.deploy-observability-dev.result }}"
          do
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              failed=true
            fi
          done

          if [ "${failed}" = "true" ]; then
            echo "Development deployment failed for ${{ needs.deploy-context.outputs.ref }}"
            exit 1
          fi

          echo "Development deployment completed for ${{ needs.deploy-context.outputs.ref }}"
