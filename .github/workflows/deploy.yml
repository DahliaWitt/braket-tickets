name: Deploy to Production

# Deploys backend to Convex (serverless) and frontend to Cloudflare Pages.
# Note: Legacy self-hosted Docker deployment has been removed.
# See ops/docker-compose.yml for local development or self-hosting reference.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Optional Git SHA override for manual production deploys.
        required: false
        default: ''
        type: string
      branch:
        description: Optional branch label override for manual production deploys.
        required: false
        default: ''
        type: string
      force_all:
        description: Force all deploy slices to run.
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-production
  # GitHub Actions added `queue: max` in May 2026. actionlint v1.7.12 still
  # reports this as an unknown key until rhysd/actionlint#654 lands.
  queue: max

permissions:
  contents: read

jobs:
  deploy-context:
    name: Resolve Production Deploy Context
    runs-on: self-hosted
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      branch: ${{ steps.resolve.outputs.branch }}
      force_all: ${{ steps.resolve.outputs.force_all }}
    steps:
      - name: Checkout repository for ref validation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Resolve deploy ref
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.ref_name }}
          DEFAULT_SHA: ${{ github.sha }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_FORCE_ALL: ${{ inputs.force_all }}
          INPUT_REF: ${{ inputs.ref }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          ref="${INPUT_REF:-${WORKFLOW_RUN_SHA:-${DEFAULT_SHA}}}"
          branch="${INPUT_BRANCH:-${WORKFLOW_RUN_BRANCH:-${DEFAULT_BRANCH}}}"
          force_all="${INPUT_FORCE_ALL:-true}"

          if [ "${WORKFLOW_EVENT}" = "workflow_run" ]; then
            force_all=true
          fi

          if [ "${branch}" != "main" ]; then
            echo "Production deploys must come from main; got ${branch}."
            exit 1
          fi

          git fetch --no-tags origin +main:refs/remotes/origin/main

          if ! git cat-file -e "${ref}^{commit}" 2>/dev/null; then
            echo "::error::Production deploy ref ${ref} is not a commit available in this repository."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${ref}" origin/main; then
            echo "::error::Production deploy ref ${ref} is not contained in origin/main."
            exit 1
          fi

          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "force_all=${force_all}" >> "${GITHUB_OUTPUT}"

  changes:
    runs-on: self-hosted
    needs: deploy-context
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      observability: ${{ steps.detect.outputs.observability }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.deploy-context.outputs.ref }}
          fetch-depth: 0
      - name: Detect changed deployment slices
        id: detect
        env:
          DEPLOY_REF: ${{ needs.deploy-context.outputs.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          FORCE_ALL: ${{ needs.deploy-context.outputs.force_all }}
        run: |
          set -euo pipefail

          backend=false
          frontend=false
          observability=false

          if [ "${FORCE_ALL}" = 'true' ]; then
            backend=true
            frontend=true
            observability=true
          else
            changed_file_list="$(mktemp)"
            if [ -n "${EVENT_BEFORE}" ] && [ "${EVENT_BEFORE}" != '0000000000000000000000000000000000000000' ]; then
              git diff --name-only "${EVENT_BEFORE}" "${DEPLOY_REF}" > "${changed_file_list}"
            else
              git show --name-only --format='' "${DEPLOY_REF}" > "${changed_file_list}"
            fi

            while IFS= read -r path; do
              [ -n "${path}" ] || continue
              case "${path}" in
                .github/workflows/ci.yml|.github/workflows/deploy.yml)
                  backend=true
                  frontend=true
                  observability=true
                  continue
                  ;;
              esac
              case "${path}" in
                backend/convex/*|backend/package.json|backend/scripts/*|convex.json|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|shared/*)
                  backend=true
                  ;;
              esac
              case "${path}" in
                frontend/*|package.json|pnpm-lock.yaml|shared/*)
                  frontend=true
                  ;;
              esac
              case "${path}" in
                ops/*|shared/log-sanitizer.mjs)
                  observability=true
                  ;;
              esac
            done < "${changed_file_list}"
          fi

          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "observability=${observability}" >> "${GITHUB_OUTPUT}"

  deploy-convex:
    name: Deploy Backend to Convex
    runs-on: self-hosted
    environment:
      name: production
      deployment: false
    needs: [deploy-context, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    env:
      AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}
      BRAKET_DEPLOY_ENV: production
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_REPLY_TO: ${{ secrets.SMTP_REPLY_TO }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_WEBHOOK_SECRET_CONNECT: ${{ secrets.STRIPE_WEBHOOK_SECRET_CONNECT }}
      STRIPE_WEBHOOK_SECRET_V2_EVENTS: ${{ secrets.STRIPE_WEBHOOK_SECRET_V2_EVENTS }}
      TOKEN_DIGEST_SECRET: ${{ secrets.TOKEN_DIGEST_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.deploy-context.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Validate localhost CORS flag for production
        run: |
          if [ -z "${ALLOW_LOCALHOST_CORS}" ]; then
            exit 0
          fi
          normalized="$(printf '%s' "${ALLOW_LOCALHOST_CORS}" | tr '[:upper:]' '[:lower:]')"
          if [ "${normalized}" = "1" ] || [ "${normalized}" = "true" ] || [ "${normalized}" = "yes" ] || [ "${normalized}" = "on" ]; then
            echo "SAFETY ABORT: ALLOW_LOCALHOST_CORS must be false in preview/prod deployments."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Sync Convex environment
        working-directory: ./backend
        run: pnpm sync:env:prod

      - name: Deploy to Convex
        env:
          DEPLOY_REF_NAME: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: pnpm convex deploy --message "production deploy ${DEPLOY_REF_NAME} @ ${DEPLOY_SHA} by ${DEPLOY_ACTOR}"

  deploy-frontend:
    name: Deploy Frontend to Cloudflare
    runs-on: self-hosted
    environment:
      name: production
      deployment: false
    needs: [deploy-context, changes, deploy-convex]
    if: ${{ needs.changes.outputs.frontend == 'true' && (needs.deploy-convex.result == 'success' || needs.deploy-convex.result == 'skipped') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.deploy-context.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Pages
        working-directory: ./frontend
        run: pnpm wrangler pages deploy dist/frontend/browser --project-name=braket-tickets-frontend --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-observability:
    name: Deploy Observability Stack (Whiterose)
    runs-on: self-hosted
    environment:
      name: production
      deployment: false
    needs: [deploy-context, changes]
    outputs:
      deployed: ${{ steps.status.outputs.needs_deploy }}
    concurrency:
      group: deploy-observability-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.deploy-context.outputs.ref }}

      - name: Ensure backup directory exists
        run: |
          mkdir -p /mnt/user/appdata/braket-tickets/convex-backups
          chown 100:101 /mnt/user/appdata/braket-tickets/convex-backups
          chmod 0770 /mnt/user/appdata/braket-tickets/convex-backups

      - name: Check observability status
        id: status
        shell: bash
        run: |
          set -euo pipefail

          changed='${{ needs.changes.outputs.observability }}'
          needs_deploy='false'
          reason='none'

          if [ "${changed}" = "true" ]; then
            needs_deploy='true'
            reason='config_changed'
          fi

          for service in convex-log-forwarder convex-backup; do
            container_id="$(docker compose -f ops/docker-compose.yml ps -q "${service}" 2>/dev/null || true)"
            if [ -z "${container_id}" ]; then
              needs_deploy='true'
              if [ "${reason}" = 'none' ]; then
                reason="missing:${service}"
              else
                reason="${reason},missing:${service}"
              fi
              continue
            fi

            running="$(docker inspect -f '{{.State.Running}}' "${container_id}" || echo false)"
            if [ "${running}" != 'true' ]; then
              needs_deploy='true'
              if [ "${reason}" = 'none' ]; then
                reason="offline:${service}"
              else
                reason="${reason},offline:${service}"
              fi
            fi
          done

          echo "needs_deploy=${needs_deploy}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

      - name: Validate CONVEX_LOG_SINK
        if: ${{ steps.status.outputs.needs_deploy == 'true' }}
        env:
          CONVEX_LOG_SINK: ${{ secrets.CONVEX_LOG_SINK || 'none' }}
        run: |
          case "${CONVEX_LOG_SINK}" in
            sentry|none)
              ;;
            *)
              echo "::error::CONVEX_LOG_SINK must be exactly 'sentry' or 'none'; got '${CONVEX_LOG_SINK:-<unset>}'"
              exit 1
              ;;
          esac

      - name: Deploy observability services (changed)
        if: ${{ steps.status.outputs.needs_deploy == 'true' && needs.changes.outputs.observability == 'true' }}
        run: docker compose -f ops/docker-compose.yml up -d --build
        env:
          BACKUP_INCLUDE_FILE_STORAGE: ${{ secrets.BACKUP_INCLUDE_FILE_STORAGE }}
          BACKUP_INTERVAL_SECONDS: ${{ secrets.BACKUP_INTERVAL_SECONDS }}
          BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_LOG_DEDUP_CACHE_SIZE: ${{ secrets.CONVEX_LOG_DEDUP_CACHE_SIZE }}
          CONVEX_LOG_FORWARD_ALL: ${{ secrets.CONVEX_LOG_FORWARD_ALL }}
          CONVEX_LOG_INCLUDE_SUCCESS: ${{ secrets.CONVEX_LOG_INCLUDE_SUCCESS }}
          CONVEX_LOG_RECONNECT_MS: ${{ secrets.CONVEX_LOG_RECONNECT_MS }}
          CONVEX_LOG_SINK: ${{ secrets.CONVEX_LOG_SINK || 'none' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BRAKET_APPDATA_ROOT: /mnt/user/appdata/braket-tickets

      - name: Restore observability services (offline or missing)
        if: ${{ steps.status.outputs.needs_deploy == 'true' && needs.changes.outputs.observability != 'true' }}
        run: docker compose -f ops/docker-compose.yml up -d
        env:
          BACKUP_INCLUDE_FILE_STORAGE: ${{ secrets.BACKUP_INCLUDE_FILE_STORAGE }}
          BACKUP_INTERVAL_SECONDS: ${{ secrets.BACKUP_INTERVAL_SECONDS }}
          BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_LOG_DEDUP_CACHE_SIZE: ${{ secrets.CONVEX_LOG_DEDUP_CACHE_SIZE }}
          CONVEX_LOG_FORWARD_ALL: ${{ secrets.CONVEX_LOG_FORWARD_ALL }}
          CONVEX_LOG_INCLUDE_SUCCESS: ${{ secrets.CONVEX_LOG_INCLUDE_SUCCESS }}
          CONVEX_LOG_RECONNECT_MS: ${{ secrets.CONVEX_LOG_RECONNECT_MS }}
          CONVEX_LOG_SINK: ${{ secrets.CONVEX_LOG_SINK || 'none' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BRAKET_APPDATA_ROOT: /mnt/user/appdata/braket-tickets

  record-deployment:
    name: Record Production Deployment
    runs-on: self-hosted
    needs:
      [
        deploy-context,
        changes,
        deploy-convex,
        deploy-frontend,
        deploy-observability,
      ]
    if: >-
      ${{
        always() &&
        needs.deploy-context.result == 'success' &&
        (
          needs.changes.result != 'success' ||
          needs.changes.outputs.backend == 'true' ||
          needs.changes.outputs.frontend == 'true' ||
          needs.changes.outputs.observability == 'true' ||
          needs.deploy-observability.outputs.deployed == 'true'
        )
      }}
    environment: production
    steps:
      - name: Record deployment
        run: |
          set -euo pipefail

          failed=false
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.deploy-convex.result }}" \
            "${{ needs.deploy-frontend.result }}" \
            "${{ needs.deploy-observability.result }}"
          do
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              failed=true
            fi
          done

          if [ "${failed}" = "true" ]; then
            echo "Production deployment failed for ${{ needs.deploy-context.outputs.ref }}"
            exit 1
          fi

          echo "Production deployment completed for ${{ needs.deploy-context.outputs.ref }}"

  publish-release:
    name: Publish GitHub Release
    runs-on: self-hosted
    needs: [deploy-context, record-deployment]
    if: >-
      ${{
        needs.deploy-context.result == 'success' &&
        needs.deploy-context.outputs.branch == 'main' &&
        needs.record-deployment.result == 'success'
      }}
    permissions:
      contents: write
    steps:
      - name: Checkout deployed ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.deploy-context.outputs.ref }}

      - name: Publish release from manifest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_REF: ${{ needs.deploy-context.outputs.ref }}
        with:
          script: |
            const fs = require('node:fs');

            const manifest = JSON.parse(
              fs.readFileSync('.release-please-manifest.json', 'utf8'),
            );
            const version = String(manifest['.'] ?? '');
            if (!/^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/.test(version)) {
              core.setFailed(
                `.release-please-manifest.json does not contain a valid root semver version; got '${version || '<unset>'}'`,
              );
              return;
            }

            const tag = `v${version}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.warning(
                `GitHub Release ${tag} already exists; leaving it unchanged. ` +
                  `This prod deploy did not publish a new release — the manifest version ` +
                  `(${version}) was not bumped since the last release. If you expected a new ` +
                  `release, merge the release-please "release" PR into develop before promoting ` +
                  `develop to main.`,
              );
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const heading = new RegExp(`^## \\[?${escaped}\\]?\\b`);
            const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
            let start = -1;
            let end = lines.length;
            for (let index = 0; index < lines.length; index += 1) {
              const line = lines[index];
              if (!line.startsWith('## ')) {
                continue;
              }
              if (start === -1 && heading.test(line)) {
                start = index + 1;
                continue;
              }
              if (start !== -1) {
                end = index;
                break;
              }
            }

            const body =
              start === -1
                ? `Release ${version}`
                : lines
                    .slice(start, end)
                    .join('\n')
                    .trim() || `Release ${version}`;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: process.env.DEPLOY_REF,
              name: tag,
              body,
            });
