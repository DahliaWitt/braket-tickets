name: CI

concurrency:
  # PRs: cancel stale runs on re-push (github.head_ref = PR branch name)
  # Branch pushes (develop/main): one run at a time without interrupting deploys
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint + Typecheck (ESLint + tsc)
    runs-on: ubuntu-latest
    # Headroom over the self-hosted era: a cold hosted runner (empty pnpm store
    # and Angular cache after eviction) needs the extra minutes.
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'production' || github.event_name == 'pull_request' && github.base_ref == 'develop' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false
    env:
      CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-node-pnpm
      - name: Install dependencies
        # Installs every workspace package (frontend included) from the root lockfile.
        run: pnpm install --frozen-lockfile
      - name: Check Convex generated files are fresh
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: pnpm check:convex-generated
      - name: Lint (root eslint + convex eslint + angular-eslint rules + ifttt-lint)
        env:
          CI: true
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm lint
      - name: Typecheck (frontend tsc + convex typecheck)
        run: pnpm typecheck

      - name: Enforce Convex sanitized logging
        run: pnpm check:convex-logging

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Headroom over the self-hosted era: a cold hosted runner (empty pnpm store
    # and Angular cache after eviction) needs the extra minutes.
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'production' || github.event_name == 'pull_request' && github.base_ref == 'develop' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-node-pnpm
      - name: Install dependencies
        # Installs every workspace package (frontend included) from the root lockfile.
        run: pnpm install --frozen-lockfile
      - name: Unit tests (frontend)
        working-directory: ./frontend
        # Frontend's package script already includes a `--` shim for forwarding args through `sh -c`,
        # so coverage flags must be passed with `pnpm test -- --coverage ...`.
        run: pnpm test -- --coverage
        env:
          CONVEX_URL: https://placeholder.convex.cloud
      - name: Unit tests (convex)
        # Coverage, JSON reporter, and outputFile are configured in backend/vitest.config.ts
        # when CI=true. No extra flags needed — just `--` to forward `--coverage` through pnpm.
        run: pnpm test:convex -- --coverage
      - name: Assert frontend coverage report exists
        id: assert_frontend_coverage
        if: always()
        run: |
          test -f frontend/coverage/coverage-final.json || {
            echo "Missing frontend coverage report: frontend/coverage/coverage-final.json"
            exit 1
          }
      - name: Assert convex coverage report exists
        id: assert_convex_coverage
        if: always()
        run: |
          test -f backend/coverage/coverage-final.json || {
            echo "Missing convex coverage report: backend/coverage/coverage-final.json"
            echo "This usually means the convex tests did not run or coverage generation failed."
            exit 1
          }
      - name: Upload frontend coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' && steps.assert_frontend_coverage.outcome == 'success' && steps.assert_convex_coverage.outcome == 'success' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: frontend/coverage/coverage-final.json
          flags: frontend
          slug: ${{ github.repository }}
          disable_search: true
          # Install the Codecov CLI from PyPI instead of downloading it from
          # cli.codecov.io. The download path GPG-verifies the binary against a
          # key fetched from keybase.io, which fails ("No public key") on
          # ephemeral hosted runners that lack the warm keyring the self-hosted
          # pool had; the PyPI path anchors integrity to pip/TLS instead.
          use_pypi: true
          # Defense in depth: even with the PyPI path, a Codecov infra flake
          # must not redden a green test suite. Coverage generation is still
          # enforced by the assert_*_coverage steps above.
          fail_ci_if_error: false
      - name: Upload convex coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' && steps.assert_frontend_coverage.outcome == 'success' && steps.assert_convex_coverage.outcome == 'success' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: backend/coverage/coverage-final.json
          flags: convex
          slug: ${{ github.repository }}
          disable_search: true
          # See the frontend upload step above.
          use_pypi: true
          fail_ci_if_error: false

  stripe-contracts:
    name: Stripe Sandbox Contracts
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Gated on lint to conserve Stripe sandbox API quota on obviously-broken pushes.
    needs: [lint]
    # Stripe sandbox contracts must always run against sandbox/test credentials.
    # Pin this job to the GitHub "development" environment (Doppler stg sync).
    environment:
      name: development
      deployment: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_WEBHOOK_SECRET_V2_EVENTS: ${{ secrets.STRIPE_WEBHOOK_SECRET_V2_EVENTS }}
      STRIPE_SANDBOX_CONNECTED_ACCOUNT_ID: ${{ secrets.STRIPE_SANDBOX_CONNECTED_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-node-pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Stripe sandbox preflight checks
        run: pnpm test:convex:sandbox:preflight
      - name: Run Stripe sandbox contract tests
        run: pnpm test:convex:sandbox

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    # Headroom over the self-hosted era: a cold hosted runner (empty pnpm store
    # and Angular cache after eviction) needs the extra minutes.
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'production' || github.event_name == 'pull_request' && github.base_ref == 'develop' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-node-pnpm
      - name: Install dependencies
        # Installs every workspace package (frontend included) from the root lockfile.
        run: pnpm install --frozen-lockfile
      - name: Enable Angular build cache on CI
        # The Angular CLI disables its build cache when it detects CI. Enable it
        # at runtime for this job only — a global angular.json setting would also
        # switch the self-hosted e2e and deploy builds to persistent incremental
        # caching on the Whiterose disk.
        working-directory: ./frontend
        run: pnpm exec ng config cli.cache.environment all
      - name: Restore Angular build cache
        # Key on the lockfile only: cache entries are immutable, and a per-sha
        # key would mint a new multi-hundred-MB entry per commit, churning the
        # repo's 10 GB cache budget and evicting the pnpm store caches.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.angular/cache
          key: angular-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            angular-build-${{ runner.os }}-
      - name: Build frontend with stats
        id: build_frontend
        working-directory: ./frontend
        run: pnpm build --stats-json
        env:
          # Use placeholder values for CI build validation
          CONVEX_URL: https://placeholder.convex.cloud
      - name: Create reports directory
        run: mkdir -p reports
      - name: Run size-limit
        id: size_limit
        working-directory: ./frontend
        run: pnpm exec size-limit --json > ../reports/bundle-size.json
        env:
          CHROMIUM_EXECUTABLE_PATH: ''
          PUPPETEER_EXECUTABLE_PATH: ''
      - name: Upload bundle analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-analysis
          path: |
            frontend/dist/frontend/stats.json
            reports/bundle-size.json
          retention-days: 1
      - name: Report bundle size
        if: always()
        run: |
          echo "## Frontend Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- build outcome: \`${{ steps.build_frontend.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Bundle Size Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- size-limit outcome: \`${{ steps.size_limit.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -s reports/bundle-size.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/bundle-size.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "size-limit did not produce a JSON report. See the 'Run size-limit' step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

  storybook:
    name: Build Storybook
    # Disabled: broken by Angular 22. See docs/runbooks/deployment-ci.md
    # (Storybook job disabled) for rationale and re-enable steps.
    # "Build Storybook" was also removed from the develop/main required status
    # checks (2026-07-08). When re-enabling this job, re-add the required check
    # with the gh api command in the runbook section.
    if: false
    runs-on: ubuntu-latest
    # Headroom over the self-hosted era: a cold hosted runner (empty pnpm store
    # and Angular cache after eviction) needs the extra minutes.
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'production' || github.event_name == 'pull_request' && github.base_ref == 'develop' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-node-pnpm
      - name: Install dependencies
        # Installs every workspace package (frontend included) from the root lockfile.
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        working-directory: ./frontend
        run: pnpm build-storybook
        env:
          CONVEX_URL: https://placeholder.convex.cloud

  e2e-check:
    name: E2E Gate
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Intentionally no `needs:` on lint/test/build — E2E starts in parallel with
    # the fan-out so PR wall-clock is max(fan-out, e2e), not their sum. A PR push
    # that fails lint may waste one E2E run, bounded by cancel-in-progress on
    # re-push (PR events only). develop/main pushes are pre-validated: the strict
    # up-to-date requirement means the merged state already passed full CI.
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check affected E2E tests
        id: check
        run: npx tsx scripts/run-affected-e2e.ts --check-only

  e2e:
    name: E2E Tests
    # GitHub-hosted (4 vCPU / 16 GB). Each job is isolated, which removes the
    # self-hosted contention and shared-browser-volume GC race. Keep browser
    # concurrency below the runner's full CPU count because the local Convex
    # backend also needs CPU throughout the suite.
    runs-on: ubuntu-latest
    # Isolated on 4 vCPU is slower than the self-hosted box; give headroom over
    # the old 15-min ceiling. Tune down once real durations are known.
    timeout-minutes: 30
    needs: [e2e-check]
    if: ${{ needs.e2e-check.outputs.should_run == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    # Never expose production environment secrets to pull_request workflows.
    # PR E2E runs always use development secrets; production is only for direct main pushes.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        # Cache key for the browser cache — the installed CLI version determines
        # the browser revisions, so keying on it invalidates on a Playwright bump.
        id: pw
        run: echo "version=$(pnpm --filter frontend exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        working-directory: ./frontend
        # On a cache hit only the OS deps need (re)installing; on a miss, download
        # the browsers too. --with-deps handles the apt packages either way.
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Enable Angular build cache on CI
        # build:e2e runs `ng build`, whose cache the CLI disables under CI by
        # default. Enable it for this job so the restored .angular/cache is used.
        working-directory: ./frontend
        run: pnpm exec ng config cli.cache.environment all

      - name: Restore Angular build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.angular/cache
          key: angular-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            angular-e2e-${{ runner.os }}-

      - name: Run E2E tests
        run: npx tsx scripts/e2e.ts --build
        env:
          # Safety defaults: E2E must target a local ephemeral Convex backend.
          # e2e.ts will replace these with per-run ephemeral ports.
          CONVEX_URL: http://127.0.0.1:3210
          CONVEX_SITE_URL: http://127.0.0.1:3211
          # Two browsers leave CPU for the local Convex backend. Running four
          # workers on a four-vCPU runner caused backend timeouts, 503s, and
          # session-initialization retries under load.
          PW_WORKERS: '2'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}

      - name: Upload E2E logs (failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            e2e-shard-*.log
            .convex-local/convex-local-backend*.log
          retention-days: 3

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 3
