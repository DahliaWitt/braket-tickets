name: CI

concurrency:
  # PRs: cancel stale runs on re-push (github.head_ref = PR branch name)
  # Branch pushes (develop/main): one run at a time without interrupting deploys
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint + Typecheck (ESLint + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'production' || github.event_name == 'pull_request' && github.base_ref == 'develop' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false
    env:
      CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Setup Node.js
        # Hosted runners are ephemeral: install the .nvmrc Node version and
        # restore the pnpm store cache between runs (the self-hosted pool relied
        # on a persistent warm disk instead).
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
      - name: Check Convex generated files are fresh
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: pnpm check:convex-generated
      - name: Lint (root eslint + convex eslint + angular-eslint rules + ifttt-lint)
        env:
          CI: true
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm lint
      - name: Typecheck (frontend tsc + convex typecheck)
        run: pnpm typecheck

      - name: Enforce Convex sanitized logging
        run: pnpm check:convex-logging

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'production' || github.event_name == 'pull_request' && github.base_ref == 'develop' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Setup Node.js
        # Hosted runners are ephemeral: install the .nvmrc Node version and
        # restore the pnpm store cache between runs (the self-hosted pool relied
        # on a persistent warm disk instead).
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
      - name: Unit tests (frontend)
        working-directory: ./frontend
        # Frontend's package script already includes a `--` shim for forwarding args through `sh -c`,
        # so coverage flags must be passed with `pnpm test -- --coverage ...`.
        run: pnpm test -- --coverage
        env:
          CONVEX_URL: https://placeholder.convex.cloud
      - name: Unit tests (convex)
        # Coverage, JSON reporter, and outputFile are configured in backend/vitest.config.ts
        # when CI=true. No extra flags needed — just `--` to forward `--coverage` through pnpm.
        run: pnpm test:convex -- --coverage
      - name: Assert frontend coverage report exists
        id: assert_frontend_coverage
        if: always()
        run: |
          test -f frontend/coverage/coverage-final.json || {
            echo "Missing frontend coverage report: frontend/coverage/coverage-final.json"
            exit 1
          }
      - name: Assert convex coverage report exists
        id: assert_convex_coverage
        if: always()
        run: |
          test -f backend/coverage/coverage-final.json || {
            echo "Missing convex coverage report: backend/coverage/coverage-final.json"
            echo "This usually means the convex tests did not run or coverage generation failed."
            exit 1
          }
      - name: Upload frontend coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' && steps.assert_frontend_coverage.outcome == 'success' && steps.assert_convex_coverage.outcome == 'success' }}
        uses: codecov/codecov-action@ad3126e916f78f00edff4ed0317cf185271ccc2d # v5.4.2
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: frontend/coverage/coverage-final.json
          flags: frontend
          slug: ${{ github.repository }}
          disable_search: true
          fail_ci_if_error: true
      - name: Upload convex coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' && steps.assert_frontend_coverage.outcome == 'success' && steps.assert_convex_coverage.outcome == 'success' }}
        uses: codecov/codecov-action@ad3126e916f78f00edff4ed0317cf185271ccc2d # v5.4.2
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: backend/coverage/coverage-final.json
          flags: convex
          slug: ${{ github.repository }}
          disable_search: true
          fail_ci_if_error: true

  stripe-contracts:
    name: Stripe Sandbox Contracts
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Gated on lint to conserve Stripe sandbox API quota on obviously-broken pushes.
    needs: [lint]
    # Stripe sandbox contracts must always run against sandbox/test credentials.
    # Pin this job to the GitHub "development" environment (Doppler stg sync).
    environment:
      name: development
      deployment: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_WEBHOOK_SECRET_V2_EVENTS: ${{ secrets.STRIPE_WEBHOOK_SECRET_V2_EVENTS }}
      STRIPE_SANDBOX_CONNECTED_ACCOUNT_ID: ${{ secrets.STRIPE_SANDBOX_CONNECTED_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Stripe sandbox preflight checks
        run: pnpm test:convex:sandbox:preflight
      - name: Run Stripe sandbox contract tests
        run: pnpm test:convex:sandbox

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'production' || github.event_name == 'pull_request' && github.base_ref == 'develop' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Setup Node.js
        # Hosted runners are ephemeral: install the .nvmrc Node version and
        # restore the pnpm store cache between runs (the self-hosted pool relied
        # on a persistent warm disk instead).
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
      - name: Restore Angular build cache
        # Requires cli.cache.environment: "all" in frontend/angular.json —
        # the Angular CLI disables its build cache on CI by default.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/.angular/cache
          key: angular-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            angular-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            angular-build-${{ runner.os }}-
      - name: Build frontend with stats
        id: build_frontend
        working-directory: ./frontend
        run: pnpm build --stats-json
        env:
          # Use placeholder values for CI build validation
          CONVEX_URL: https://placeholder.convex.cloud
      - name: Create reports directory
        run: mkdir -p reports
      - name: Run size-limit
        id: size_limit
        working-directory: ./frontend
        run: pnpm exec size-limit --json > ../reports/bundle-size.json
        env:
          CHROMIUM_EXECUTABLE_PATH: ''
          PUPPETEER_EXECUTABLE_PATH: ''
      - name: Upload bundle analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-analysis
          path: |
            frontend/dist/frontend/stats.json
            reports/bundle-size.json
          retention-days: 1
      - name: Report bundle size
        if: always()
        run: |
          echo "## Frontend Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- build outcome: \`${{ steps.build_frontend.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Bundle Size Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- size-limit outcome: \`${{ steps.size_limit.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -s reports/bundle-size.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/bundle-size.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "size-limit did not produce a JSON report. See the 'Run size-limit' step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

  storybook:
    name: Build Storybook
    # Disabled: broken by Angular 22. See docs/runbooks/deployment-ci.md
    # (Storybook job disabled) for rationale and re-enable steps.
    # "Build Storybook" was also removed from the develop/main required status
    # checks (2026-07-08). When re-enabling this job, re-add the required check
    # with the gh api command in the runbook section.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'production' || github.event_name == 'pull_request' && github.base_ref == 'develop' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Setup Node.js
        # Hosted runners are ephemeral: install the .nvmrc Node version and
        # restore the pnpm store cache between runs (the self-hosted pool relied
        # on a persistent warm disk instead).
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        working-directory: ./frontend
        run: pnpm build-storybook
        env:
          CONVEX_URL: https://placeholder.convex.cloud

  e2e-check:
    name: E2E Gate
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Intentionally no `needs:` on lint/test/build — E2E starts in parallel with
    # the fan-out so PR wall-clock is max(fan-out, e2e), not their sum. A push
    # that fails lint may waste one E2E run; cancel-in-progress bounds the cost.
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Check affected E2E tests
        id: check
        run: npx tsx scripts/run-affected-e2e.ts --check-only

  e2e:
    name: E2E Tests
    runs-on: self-hosted
    timeout-minutes: 15
    needs: [e2e-check]
    if: ${{ needs.e2e-check.outputs.should_run == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    # Never expose production environment secrets to pull_request workflows.
    # PR E2E runs always use development secrets; production is only for direct main pushes.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Setup Node.js
        # e2e.ts --build compiles the Angular app, which requires Node >=22.22.3
        # (newer than the runner image). Pin via .nvmrc until the image is rebuilt.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Fix interrupted dpkg state
        run: sudo dpkg --configure -a 2>/dev/null || true

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: |
          if [ -n "${PLAYWRIGHT_BROWSERS_PATH:-}" ] && [ -d "$PLAYWRIGHT_BROWSERS_PATH" ]; then
            echo "Using pre-installed browsers at $PLAYWRIGHT_BROWSERS_PATH"
            # Ensure the currently locked Playwright browser revisions exist.
            # install-deps only installs system packages and won't download missing browsers.
            pnpm exec playwright install chromium webkit
            pnpm exec playwright install-deps chromium webkit 2>/dev/null || true
          else
            echo "PLAYWRIGHT_BROWSERS_PATH not set or missing — installing browsers"
            pnpm exec playwright install --with-deps chromium webkit
          fi

      - name: Run E2E tests
        run: npx tsx scripts/e2e.ts --build
        env:
          # Safety defaults: E2E must target a local ephemeral Convex backend.
          # e2e.ts will replace these with per-run ephemeral ports.
          CONVEX_URL: http://127.0.0.1:3210
          CONVEX_SITE_URL: http://127.0.0.1:3211
          PW_WORKERS: '5'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}

      - name: Upload E2E logs (failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            e2e-shard-*.log
            .convex-local/convex-local-backend*.log
          retention-days: 3

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 3
