<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Environment variable flow</title>
  <desc id="desc">Doppler config feeds local shells, GitHub environment secrets, Angular runtime config, GitHub Actions builds, sync-env, and Convex deployment variables.</desc>
  <defs>
    <style>
      .bg{fill:#111114}
      .box{fill:#24242b;stroke:#71717a;stroke-width:2}
      .source{fill:#292524;stroke:#f59e0b}
      .target{fill:#172554;stroke:#60a5fa}
      .text{fill:#f4f4f5;font:600 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .small{fill:#d4d4d8;font:500 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .line{stroke:#a1a1aa;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#a1a1aa"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="520" rx="20"/>
  <rect class="box source" x="60" y="214" width="210" height="92" rx="12"/>
  <text class="text" x="165" y="250" text-anchor="middle">Doppler</text>
  <text class="small" x="165" y="276" text-anchor="middle">local / stg / prd</text>

  <rect class="box" x="390" y="78" width="220" height="78" rx="10"/>
  <text class="text" x="500" y="112" text-anchor="middle">Local Shell</text>
  <text class="small" x="500" y="136" text-anchor="middle">doppler run</text>
  <rect class="box" x="390" y="222" width="220" height="78" rx="10"/>
  <text class="text" x="500" y="256" text-anchor="middle">GitHub Secrets</text>
  <text class="small" x="500" y="280" text-anchor="middle">synced environments</text>
  <rect class="box" x="390" y="366" width="220" height="78" rx="10"/>
  <text class="text" x="500" y="400" text-anchor="middle">sync-env.ts</text>
  <text class="small" x="500" y="424" text-anchor="middle">allowlisted backend vars</text>

  <rect class="box target" x="760" y="78" width="250" height="78" rx="10"/>
  <text class="text" x="885" y="112" text-anchor="middle">Runtime Config</text>
  <text class="small" x="885" y="136" text-anchor="middle">Angular define injection</text>
  <rect class="box target" x="760" y="222" width="250" height="78" rx="10"/>
  <text class="text" x="885" y="256" text-anchor="middle">GitHub Actions</text>
  <text class="small" x="885" y="280" text-anchor="middle">CI and deploy builds</text>
  <rect class="box target" x="760" y="366" width="250" height="78" rx="10"/>
  <text class="text" x="885" y="400" text-anchor="middle">Convex Env Vars</text>
  <text class="small" x="885" y="424" text-anchor="middle">deployment configuration</text>

  <path class="line" d="M270 244c42-98 70-126 120-127"/>
  <path class="line" d="M270 260h120"/>
  <path class="line" d="M270 276c42 98 70 126 120 127"/>
  <path class="line" d="M610 117h150"/>
  <path class="line" d="M610 261h150"/>
  <path class="line" d="M610 405h150"/>
</svg>
